name: Deploy demo to GitHub Pages

on:
  push:
    branches:
      - main
      # Allow demo previews from working branches without merging first.
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, but don't cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download source
        run: |
          curl -fsSL \
            "https://codeload.github.com/$GITHUB_REPOSITORY/tar.gz/$GITHUB_SHA" \
            -o source.tar.gz
          tar -xzf source.tar.gz --strip-components=1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (demo)
        env:
          VITE_DEMO_MODE: 'true'
          VITE_BASE: '/${{ github.event.repository.name }}/'
          # Maps key is exposed in the client bundle. Restrict it in GCP:
          #   - HTTP-referrer: https://<owner>.github.io/<repo>/*
          #   - APIs: Maps JS + Geocoding + Places + Routes
          #   - Daily quotas + billing budget alert
          GOOGLE_MAPS_PLATFORM_KEY: ${{ secrets.GOOGLE_MAPS_PLATFORM_KEY }}
          # Gemini key is also exposed in the bundle (the demo password gate
          # is only a soft barrier). Use a dedicated key with:
          #   - Daily quota cap on the AI Studio side (e.g. 200/day)
          #   - Billing budget alert (e.g. $5/month)
          # NOTE: If you set HTTP-referrer restrictions on this key in GCP,
          # the allow-list MUST include the Pages origin, e.g.
          #   https://<owner>.github.io/<repo>/*
          # Otherwise the API returns 403 "Requests to this API ... are blocked".
          # If unsure, leave the key with "None" application restrictions and
          # rely on the daily quota + budget alert above.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx vite build

      - name: Archive Pages artifact
        run: |
          tar \
            --dereference --hard-dereference \
            --directory dist \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            --exclude=.[^/]* \
            .

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
          archive: false

      - name: Deploy to GitHub Pages
        id: deployment
        uses: ./.github/actions/deploy-pages
