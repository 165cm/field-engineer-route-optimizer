name: Deploy demo to GitHub Pages

on:
  push:
    branches:
      - main
      # Allow demo previews from working branches without merging first.
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, but don't cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (demo)
        env:
          VITE_DEMO_MODE: 'true'
          VITE_BASE: '/${{ github.event.repository.name }}/'
          # Maps key is exposed in the client bundle. Restrict it in GCP:
          #   - HTTP-referrer: https://<owner>.github.io/<repo>/*
          #   - APIs: Maps JS + Geocoding + Places + Routes
          #   - Daily quotas + billing budget alert
          GOOGLE_MAPS_PLATFORM_KEY: ${{ secrets.GOOGLE_MAPS_PLATFORM_KEY }}
          # Gemini key is also exposed in the bundle (the demo password gate
          # is only a soft barrier). Use a dedicated key with:
          #   - Daily quota cap on the AI Studio side (e.g. 200/day)
          #   - Billing budget alert (e.g. $5/month)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx vite build

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
